name: Inquiro
options:
  bundleIdPrefix: com.inquiro
  deploymentTarget:
    macOS: "15.0"
  generateEmptyDirectories: true

targets:
  Inquiro:
    type: application
    platform: macOS
    sources:
      - path: Inquiro
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inquiro.app
        PRODUCT_NAME: Inquiro
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Inquiro.entitlements
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: false
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: AppIcon
        LSUIElement: false
        CFBundleDisplayName: Inquiro
